<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diskmap</title>
<style>
:root{
  --bg:#f6f6f4; --panel:#ffffff; --line:#e7e7e3; --line2:#efefec; --text:#1b1b19; --muted:#7a7a74; --faint:#a6a6a0;
  --chip:#f2f2ef; --btn:#1b1b19; --btnText:#fff; --shadow:0 1px 2px rgba(0,0,0,.04);
  --green:#1f9254; --greenBg:#e5f4ea; --amber:#c27412; --amberBg:#fcf0de; --red:#c8382c; --redBg:#fbe7e4; --blue:#2f6fc4; --blueBg:#e6eefa;
  --media-bg:#fbede2; --media-bd:#efc8a6; --media-tx:#9a5a24;
  --other-bg:#f0f0ee; --other-bd:#d8d8d3; --other-tx:#6c6c66;
  --code-bg:#ecebfc; --code-bd:#c8c3f1; --code-tx:#5b4fc4;
  --sdk-bg:#e3eff7; --sdk-bd:#b3d0e5; --sdk-tx:#2f6c96;
  --ai-bg:#fbe6ee; --ai-bd:#efbacd; --ai-tx:#a33d64;
  --cache-bg:#e6ebf8; --cache-bd:#bcc8ec; --cache-tx:#3c56a8;
  --hatch:rgba(31,146,84,.38); --hatchR:rgba(194,116,18,.38); --candBd:#7cc49b; --candBdR:#e2b06c;
  --m-app:#5b4fc4; --m-wired:#c27412; --m-comp:#a33d64; --m-cache:#b3d0e5;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121211; --panel:#1b1b1a; --line:#2c2c2a; --line2:#242422; --text:#ececea; --muted:#9a9a94; --faint:#6c6c67;
    --chip:#262624; --btn:#ececea; --btnText:#121211; --shadow:none;
    --green:#4cc285; --greenBg:#173326; --amber:#e7a24a; --amberBg:#3a2a14; --red:#f07468; --redBg:#3d1d1a; --blue:#7fb0f5; --blueBg:#1b2b42;
    --media-bg:#3a2a1e; --media-bd:#6b4a30; --media-tx:#f0b98a;
    --other-bg:#262624; --other-bd:#3d3d3a; --other-tx:#a8a8a2;
    --code-bg:#272442; --code-bd:#4a4380; --code-tx:#b9b1ff;
    --sdk-bg:#1c2e3b; --sdk-bd:#335a75; --sdk-tx:#8cc3e8;
    --ai-bg:#3a1f2a; --ai-bd:#6e3a50; --ai-tx:#f3a3c1;
    --cache-bg:#1f2640; --cache-bd:#3c4a7c; --cache-tx:#a5b6f2;
    --hatch:rgba(76,194,133,.35); --hatchR:rgba(231,162,74,.35); --candBd:#3f8a62; --candBdR:#8a6431;
    --m-app:#9d93ff; --m-wired:#e7a24a; --m-comp:#f3a3c1; --m-cache:#335a75;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace}
button{font:inherit;color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding:20px 20px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 14px;flex-wrap:wrap}
header.top h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
header.top h1 .host{color:var(--muted);font-weight:450}
.livepill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:550;padding:2px 9px;border-radius:999px;background:var(--greenBg);color:var(--green)}
.livepill i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
.livepill.off{background:var(--chip);color:var(--muted)}
.livepill.off i{animation:none}
@keyframes pulse{50%{opacity:.3}}
header.top .meta{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header.top .warn{color:var(--amber);cursor:pointer;text-decoration:underline dotted}
.spin{width:10px;height:10px;border:1.5px solid var(--faint);border-top-color:var(--text);border-radius:50%;display:inline-block;animation:sp .8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:26px 2px 10px}
h2.sec:first-of-type{margin-top:0}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card h3{font-size:13px;margin:0;font-weight:650}
.sub{color:var(--muted);font-size:11.5px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:14px;overflow:hidden}
.stat{padding:14px 18px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat .lbl{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex:none}
.stat .val{margin-top:6px;font-size:20px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.stat .val small{font-size:11px;font-weight:450;color:var(--muted);margin-left:6px}
.stat .val small.up{color:var(--green)}
.stat .foot2{font-size:11px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.click{cursor:pointer}
.stat.click:hover{background:var(--chip)}
.stat .more{margin-left:auto;font-size:11px;color:var(--faint)}
.spark{display:block;width:100%;height:34px;margin-top:8px}
.spark path.a{fill:currentColor;opacity:.12}
.spark path.l{fill:none;stroke:currentColor;stroke-width:1.5;vector-effect:non-scaling-stroke}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:550;white-space:nowrap}
.pill.safe,.pill.normal{background:var(--greenBg);color:var(--green)}
.pill.review,.pill.warning{background:var(--amberBg);color:var(--amber)}
.pill.critical{background:var(--redBg);color:var(--red)}
.membar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line2);margin-top:10px;gap:1px}
.membar i{display:block;height:100%}
.mleg{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10.5px;color:var(--muted);margin-top:6px}
.mleg i{display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:4px}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px}
.panel{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line2)}
.pbody{overflow:auto;max-height:420px}
.count{font-size:11px;color:var(--muted);background:var(--chip);border-radius:999px;padding:1px 7px;margin-left:6px;font-weight:550}

.sg{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line2);align-items:start}
.sg:last-child{border-bottom:0}
.sg .dot{margin-top:6px;width:8px;height:8px}
.sev-high{background:var(--red)} .sev-med{background:var(--amber)} .sev-low{background:var(--blue)} .sev-info{background:var(--faint)}
.sg .t{font-weight:600;font-size:12.5px}
.sg .s{font-size:12px;color:var(--muted);margin-top:2px}
.sg .acts{display:flex;gap:6px;align-items:center}
.x{border:0;background:none;color:var(--faint);cursor:pointer;width:22px;height:22px;border-radius:5px;font-size:15px;line-height:1}
.x:hover{background:var(--chip);color:var(--text)}
.okstate{padding:28px 16px;text-align:center;color:var(--muted);font-size:12.5px}
.okstate b{display:block;color:var(--green);font-size:13px;margin-bottom:2px}

table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t td,table.t th{padding:7px 10px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap}
table.t th{font-size:11px;color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--panel);z-index:1}
table.t td:first-child,table.t th:first-child{padding-left:16px}
table.t td:last-child,table.t th:last-child{padding-right:16px;text-align:right}
table.t tr:last-child td{border-bottom:0}
table.t .num{text-align:right;font-family:ui-monospace,"SF Mono",Menlo,monospace}
.appn{display:flex;align-items:center;gap:10px;min-width:0;max-width:280px}
.appn .ic{width:22px;height:22px;border-radius:5px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:650;color:var(--muted);background:var(--chip)}
.appn img.ic{background:none}
.appn .nm{overflow:hidden;text-overflow:ellipsis;font-weight:550}
.appn .sm{font-size:10.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis}
.cpub{display:inline-block;width:38px;height:4px;border-radius:2px;background:var(--line2);vertical-align:middle;margin-left:8px;overflow:hidden}
.cpub i{display:block;height:100%;background:var(--text);opacity:.6}
.tag{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--muted);margin-left:6px;font-weight:550;vertical-align:1px}
.tag.dup{background:var(--amberBg);color:var(--amber)}
.tag.heavy{background:var(--blueBg);color:var(--blue)}
.tag.lan{background:var(--redBg);color:var(--red)}
.more-row{padding:10px 16px;text-align:center}
.linkbtn{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;text-decoration:underline;text-underline-offset:2px}

.bhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--chip);font-size:12px;position:sticky;top:0;z-index:1}
.bhead b{font-weight:600}
.tab{display:grid;grid-template-columns:20px minmax(0,1fr) auto 22px;gap:10px;align-items:center;padding:6px 16px;border-bottom:1px solid var(--line2);font-size:12px}
.tab .fav{width:18px;height:18px;border-radius:4px;background:var(--line);display:grid;place-items:center;font-size:10px;font-weight:650;color:var(--muted)}
.tab .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .dm{font-size:10.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{padding:12px 16px;font-size:12px;color:var(--muted)}
.subh{padding:12px 16px 4px;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}

.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px}
.explorer{padding:16px 16px 12px;display:flex;flex-direction:column;min-width:0}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:2px;flex:none}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;font-size:12px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.crumbs{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-size:12px;color:var(--muted);gap:10px}
.crumbs nav{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:0}
.crumbs a{color:var(--muted);cursor:pointer;text-decoration:none;white-space:nowrap}
.crumbs a:hover{color:var(--text)}
.crumbs a.cur{color:var(--text);font-weight:550;cursor:default}
.crumbs .sep{color:var(--faint)}
#map{position:relative;height:clamp(420px,64vh,700px);border-radius:8px;overflow:hidden;user-select:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.tile{position:absolute;border:1px solid;border-radius:5px;overflow:hidden;cursor:pointer;transition:filter .12s, opacity .15s, outline-color .12s, width .4s, height .4s, left .4s, top .4s;outline:2px solid transparent;outline-offset:-1px}
.tile:hover{filter:brightness(.97)}
@media (prefers-color-scheme: dark){.tile:hover{filter:brightness(1.12)}}
.tile .nm{position:absolute;left:7px;top:5px;right:7px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.tile .hd{position:absolute;left:7px;right:7px;top:4px;display:flex;justify-content:space-between;gap:6px;font-size:11px;pointer-events:none}
.tile .hd b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .hd span{opacity:.75;white-space:nowrap}
.tile .sz{position:absolute;left:7px;bottom:5px;font-weight:650;pointer-events:none;white-space:nowrap}
.tile.flat{cursor:default}
.k-media{background:var(--media-bg);border-color:var(--media-bd);color:var(--media-tx)}
.k-other{background:var(--other-bg);border-color:var(--other-bd);color:var(--other-tx)}
.k-code{background:var(--code-bg);border-color:var(--code-bd);color:var(--code-tx)}
.k-sdk{background:var(--sdk-bg);border-color:var(--sdk-bd);color:var(--sdk-tx)}
.k-ai{background:var(--ai-bg);border-color:var(--ai-bd);color:var(--ai-tx)}
.k-cache{background:var(--cache-bg);border-color:var(--cache-bd);color:var(--cache-tx)}
.tile.cand{border-color:var(--candBd);background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 7px)}
.tile.cand.review{border-color:var(--candBdR);background-image:repeating-linear-gradient(135deg,var(--hatchR) 0 1px,transparent 1px 7px)}
.tile.cand.sel{border-width:1.5px}
.tile.cand.inh,.v-cleanup .tile.cand.inh{background-image:none!important;border-color:transparent;background-color:transparent!important}
.tile.hl{outline-color:var(--text);z-index:3}
.v-cleanup .tile:not(.cand){background:var(--other-bg);border-color:var(--line);color:var(--faint)}
.v-cleanup .tile.cand{color:var(--green);background-color:var(--greenBg)}
.v-cleanup .tile.cand.review{color:var(--amber);background-color:var(--amberBg)}
.v-cleanup .tile.cand:not(.sel){opacity:.55}
.v-cleanup .tile.cand.sel{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 2px,transparent 2px 6px)}
.v-cleanup .tile.cand.review.sel{background-image:repeating-linear-gradient(135deg,var(--hatchR) 0 2px,transparent 2px 6px)}

.recs{display:flex;flex-direction:column;height:calc(clamp(420px,64vh,700px) + 120px);min-height:0}
.recs .rh{padding:16px 16px 10px;border-bottom:1px solid var(--line2)}
.list{overflow:auto;flex:1;min-height:0;padding:4px 0}
.grp{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px}
.grp .tot{font-size:11.5px;color:var(--muted)}
.rec{border-bottom:1px solid var(--line2)}
.rec:last-child{border-bottom:0}
.row{display:grid;grid-template-columns:20px minmax(0,1fr) auto 18px;gap:10px;align-items:center;padding:10px 16px;cursor:pointer}
.row:hover{background:var(--chip)}
.row .t{font-weight:550;font-size:12.5px}
.row .p{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .s{font-size:12px;font-weight:600;white-space:nowrap}
.chev{border:0;background:none;color:var(--faint);cursor:pointer;padding:0;width:18px;height:18px;display:grid;place-items:center;border-radius:4px;transition:transform .15s}
.rec.open .chev{transform:rotate(90deg)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:16px;height:16px;margin:0;border:1.5px solid var(--faint);border-radius:4px;display:grid;place-items:center;cursor:pointer;background:var(--panel)}
input[type=checkbox]:checked,input[type=checkbox]:indeterminate{background:var(--text);border-color:var(--text)}
input[type=checkbox]:checked::after{content:"";width:8px;height:4px;border:2px solid var(--panel);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
input[type=checkbox]:indeterminate::after{content:"";width:8px;height:2px;background:var(--panel);border-radius:1px}
.det{display:none;padding:0 16px 12px 46px;font-size:12px}
.rec.open .det{display:block}
.det .note2{color:var(--muted);margin-bottom:8px}
.it{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 0}
.it .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .ip{font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .is{font-size:11.5px;color:var(--muted)}
.cmd{margin-top:8px;background:var(--chip);border-radius:6px;padding:7px 9px;font-size:11px;white-space:pre-wrap;word-break:break-all;color:var(--muted)}
.foot{border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.foot .selinfo{font-size:12px;color:var(--muted)}
.foot .selinfo b{color:var(--text)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:8px;font-size:12px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{background:var(--chip)}
.btn.sm{padding:3px 9px;font-size:11.5px;border-radius:6px}
.btn.dark{background:var(--btn);color:var(--btnText);border-color:var(--btn)}
.btn.dark:hover{opacity:.88}
.btn.armed{background:var(--red);border-color:var(--red);color:#fff}
.btn.busy{opacity:.55;pointer-events:none}
.btn:disabled{opacity:.4;cursor:default}

#tip{position:fixed;pointer-events:none;z-index:50;background:var(--text);color:var(--bg);padding:7px 10px;border-radius:7px;font-size:11.5px;max-width:340px;opacity:0;transition:opacity .08s}
#tip .tp{opacity:.7;word-break:break-all}
#tip .tr{margin-top:3px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 14px;border-radius:9px;font-size:12.5px;opacity:0;transition:all .2s;z-index:60;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast code{opacity:.8}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal.on{display:flex}
.modal .card{width:min(820px,100%);max-height:86vh;display:flex;flex-direction:column}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal pre{margin:0;padding:14px 16px;overflow:auto;font-size:11.5px;line-height:1.55;flex:1}
.modal .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.modal .mf .sub{margin:0}
.orow{padding:9px 16px}
.orow .top{display:flex;justify-content:space-between;gap:12px;font-size:12.5px}
.orow .top b{font-weight:550}
.orow .pp{font-size:11px;color:var(--muted);margin-top:1px}
.orow .bar{height:4px;border-radius:2px;background:var(--line2);margin-top:6px;overflow:hidden}
.orow .bar i{display:block;height:100%;background:var(--muted);border-radius:2px}
.orow.rest .bar i{background:var(--amber)}
#onote p{margin:0 0 6px;font-size:12px;color:var(--muted)}
#onote p:last-child{margin:0}
#onote code{font-size:11px;background:var(--chip);padding:1px 5px;border-radius:4px;color:var(--text)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.unread{display:none;margin:-4px 0 14px;padding:12px 16px;font-size:12px}
.unread.on{display:block}
.unread ul{margin:6px 0 0;padding-left:18px;max-height:140px;overflow:auto;color:var(--muted)}
.ro .act{display:none}
.stats8{grid-template-columns:repeat(4,1fr)}
:root{--c1:#2f6fc4;--c2:#c27412}
@media (prefers-color-scheme: dark){:root{--c1:#5b95e6;--c2:#c47e22}}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin:0 0 16px;padding:3px;background:var(--chip);border-radius:10px;scrollbar-width:none;position:sticky;top:8px;z-index:20;box-shadow:0 0 0 6px var(--bg)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font-size:12.5px;font-weight:550;padding:6px 9px;border-radius:8px;white-space:nowrap;display:flex;align-items:center;gap:5px}
nav.tabs a:hover{color:var(--text)}
nav.tabs a.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
nav.tabs a svg{width:14px;height:14px;opacity:.75;flex:none}
nav.tabs a.on svg{opacity:1;color:#7c70f0}
nav.tabs .nsep{flex:none;width:1px;margin:7px 4px;background:var(--line)}
.card{border-radius:14px;transition:border-color .15s}
.ph{padding:15px 18px 11px}

function fmt(b){
  if (b >= 1e12) return (b/1e12).toFixed(2)+" TB";
  if (b >= 1e9) return (b/1e9).toFixed(1)+" GB";
  if (b >= 1e7) return Math.round(b/1e6)+" MB";
  if (b >= 1e6) return (b/1e6).toFixed(1)+" MB";
  return Math.max(0, Math.round(b/1e3))+" KB";
}
function ago(t){
  const s = Math.max(0, (Date.now()/1000) - t);
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s/60) + " min ago";
  if (s < 86400) return Math.round(s/3600) + " h ago";
  return Math.round(s/86400) + " d ago";
}
function dur(s){ if (!s) return ""; const d = Math.floor(s/86400), h = Math.floor(s%86400/3600); return d ? `${d}d ${h}h` : `${h}h ${Math.floor(s%3600/60)}m`; }

function toast(html, ms){
  const t = $("toast"); t.innerHTML = html; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), ms || 5200);

async function post(body){
  const r = await fetch("/api/action", {method:"POST", headers:{"Content-Type":"application/json","X-Token":LIVE.token}, body:JSON.stringify(body)});
  const j = await r.json().catch(() => ({ok:false, error:"Bad response"}));
  if (!j.ok) throw new Error(j.error || "Failed");
  return j.msg;

function spark(vals, max, color){
  const n = vals.length; if (n < 2) return `<svg class="spark"></svg>`;
  const N = 150, w = 300, h = 34, dx = w / (N - 1), off = (N - n) * dx;
  const pts = vals.map((v, i) => [off + i*dx, h - 2 - Math.min(1, Math.max(0, v / max)) * (h - 4)]);
  const line = "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="color:${color}"><path class="a" d="${line} L${w} ${h} L${off} ${h} Z"/><path class="l" d="${line}"/></svg>`;

// ---------- action buttons (shared) ----------
function actBtn(a, cls){
  if (RO || !LIVE) return "";
  return `<button class="btn sm act ${cls || ""}" data-a="${esc(JSON.stringify(a))}">${esc(a.label)}</button>`;
}
document.addEventListener("click", async e => {
  const b = e.target.closest(".act"); if (!b) return;
  const a = JSON.parse(b.dataset.a);
  if (a.kind === "scroll"){ location.hash = "#/" + ({disk:"storage", tabs:"processes", dev:"network"}[a.target] || a.target); return; }
  if (a.confirm && !b.classList.contains("armed")){
    b.classList.add("armed"); b.dataset.orig = b.textContent; b.textContent = "Confirm";
    setTimeout(() => { if (b.isConnected && b.classList.contains("armed")){ b.classList.remove("armed"); b.textContent = b.dataset.orig; } }, 3500);
    return;
  }
  b.classList.remove("armed"); b.classList.add("busy");
  try { toast(esc(await post(a))); }
  catch(err){ toast("⚠︎ " + esc(err.message), 7000); }
  finally { b.classList.remove("busy"); if (b.dataset.orig) b.textContent = b.dataset.orig; }
});

// ---------- live rendering ----------
let S = null, appSort = "mem", appAll = false, tabMode = "flag";
const dismissed = {};
try { Object.assign(dismissed, JSON.parse(localStorage.getItem("dm-dismissed") || "{}")); } catch(e){}
function dismiss(id){ dismissed[id] = Date.now() + 30*60*1000; try { localStorage.setItem("dm-dismissed", JSON.stringify(dismissed)); } catch(e){} renderSuggestions(); }

function renderLive(s){
  S = s;
  const c = s.cpu, m = s.mem, d = s.disk;
  $("c-cpu").innerHTML = `<div class="lbl">CPU<span class="more">${c.cores} cores</span></div>
    <div class="val mono">${Math.round(c.total)}%<small>load ${c.load[0].toFixed(1)}</small></div>
    ${spark(c.hist, 100, "var(--m-app)")}
    <div class="foot2">${c.user != null ? `user ${Math.round(c.user)}% · system ${Math.round(c.sys)}% · ` : ""}${s.procs} processes</div>`;
  if (s.gpu){
    $("c-gpu").innerHTML = `<div class="lbl">GPU</div><div class="val mono">${s.gpu.util}%${s.gpu.mem ? `<small>${fmt(s.gpu.mem)} in use</small>` : ""}</div>
      ${spark(s.gpu.hist, 100, "var(--m-comp)")}<div class="foot2">${s.uptime ? "Up " + dur(s.uptime) : ""}</div>`;
  } else {
    $("c-gpu").innerHTML = `<div class="lbl">Uptime</div><div class="val mono">${dur(s.uptime) || "–"}</div><div class="foot2">GPU stats need macOS</div>`;
  }
  const seg = (v, col, l) => v > 0 ? `<i style="width:${(v / m.total * 100).toFixed(2)}%;background:${col}" title="${l} ${fmt(v)}"></i>` : "";
  $("c-mem").innerHTML = `<div class="lbl">Memory<span class="pill ${m.pressure}" style="margin-left:auto">${m.pressure === "normal" ? "No pressure" : m.pressure === "warning" ? "Pressure" : "Critical"}</span></div>
    <div class="val mono">${fmt(m.used)}<small>of ${fmt(m.total)}</small></div>
    <div class="membar">${seg(m.app, "var(--m-app)", "App")}${seg(m.wired, "var(--m-wired)", "Wired")}${seg(m.compressed, "var(--m-comp)", "Compressed")}${seg(m.cached, "var(--m-cache)", "Cached")}</div>
    <div class="mleg"><span><i style="background:var(--m-app)"></i>App ${fmt(m.app)}</span><span><i style="background:var(--m-wired)"></i>Wired ${fmt(m.wired)}</span>${m.compressed ? `<span><i style="background:var(--m-comp)"></i>Compressed ${fmt(m.compressed)}</span>` : ""}<span>Swap ${fmt(m.swap)}</span></div>`;
  const usedPct = d.used / d.total * 100;
  const sel = D ? totalSel() : 0;
  $("c-disk").innerHTML = `<div class="lbl">Disk<span class="more">${Math.round(usedPct)}% full</span></div>
    <div class="val mono">${fmt(d.free)}<small>free of ${fmt(d.total)}</small></div>
    <div class="membar"><i style="width:${usedPct.toFixed(1)}%;background:${usedPct > 92 ? "var(--red)" : usedPct > 85 ? "var(--amber)" : "var(--text)"};opacity:.75"></i></div>
    <div class="foot2">${sel ? `<span style="color:var(--green)">+${fmt(sel)}</span> if you clean what's selected below` : "Select items below to free space"}</div>`;
  renderSuggestions(); renderApps(); renderTabs(); renderDev();
  if (window.DM_onLive) try { window.DM_onLive(s); } catch(err){ console.error(err); }
  (window.DM_hooks || []).forEach(f => { try { f(s); } catch(err){ console.error(err); } });
  try { renderHW(s); } catch(err){ console.error(err); }
  if (D) syncFree();
}

function renderSuggestions(){
  if (!S) return;
  const now = Date.now();
  const list = S.suggestions.concat(infoSuggestions()).filter(x => !(dismissed[x.id] > now));
  list.sort((a, b) => ({high:0, med:1, low:2, info:3}[a.sev] - {high:0, med:1, low:2, info:3}[b.sev]));
  $("sgc").textContent = list.length;
  $("sg").innerHTML = list.length ? list.map(x => `
    <div class="sg"><span class="dot sev-${x.sev}"></span>
      <div style="min-width:0"><div class="t">${esc(x.title)}</div><div class="s">${esc(x.sub)}</div></div>
      <div class="acts">${x.actions.map((a, i) => actBtn(a, i === 0 && x.sev !== "info" ? "dark" : "")).join("")}<button class="x" data-dismiss="${esc(x.id)}" title="Hide for 30 minutes">×</button></div>
    </div>`).join("")
    : `<div class="okstate"><b>All good</b>Nothing needs your attention right now.</div>`;
}
$("sg") && $("sg").addEventListener("click", e => { const b = e.target.closest("[data-dismiss]"); if (b) dismiss(b.dataset.dismiss); });

const badIcon = new Set();
window.__dmBadIcon = (img) => { badIcon.add(img.dataset.app); img.replaceWith(Object.assign(document.createElement("span"), {className:"ic", textContent:img.dataset.l})); };
const icon = (a) => a.app && !badIcon.has(a.app) ? `<img class="ic" src="/api/icon?p=${encodeURIComponent(a.app)}" alt="" data-app="${esc(a.app)}" data-l="${esc((a.name[0] || "?").toUpperCase())}" onerror="__dmBadIcon(this)">`
                         : `<span class="ic">${esc((a.name[0] || "?").toUpperCase())}</span>`;
function renderApps(){
  const apps = S.apps.slice().sort((a, b) => appSort === "cpu" ? b.cpu - a.cpu : appSort === "power" ? (b.power || 0) - (a.power || 0) : b.mem - a.mem);
  const shown = appAll ? apps : apps.slice(0, 12);
  const maxc = Math.max(100, ...apps.map(a => a.cpu));
  $("apps").innerHTML = `<table class="t"><thead><tr><th>App</th><th class="num">CPU</th><th class="num">Memory</th><th class="num hide-n" title="Threads">Thr</th><th class="num hide-n" title="Energy impact">Energy</th><th></th></tr></thead><tbody>` +
    shown.map(a => {
      let action = "";
      if (!a.protected && a.kind === "app") action = actBtn({label:"Quit", kind:"quit_app", app:a.app, confirm:`Quit ${a.name}?`});
      else if (!a.protected && a.mine) action = actBtn({label:"Stop", kind:"stop_group", key:a.key, confirm:`Stop ${a.name}?`});
      const sub = [a.n > 1 ? a.n + " processes" : "", a.front ? "in use" : "", a.explain || (a.system ? "macOS" : "")].filter(Boolean).join(" · ");
      return `<tr class="drill" data-app="${esc(a.name)}" title="${esc(a.explain || a.app || a.name)}">
        <td><div class="appn">${icon(a)}<div style="min-width:0"><div class="nm">${esc(a.name)}</div>${sub ? `<div class="sm">${esc(sub)}</div>` : ""}</div></div></td>
        <td class="num">${a.cpu.toFixed(1)}%<span class="cpub"><i style="width:${Math.min(100, a.cpu / maxc * 100)}%"></i></span></td>
        <td class="num">${fmt(a.mem)}</td><td class="num hide-n">${a.th || ""}</td><td class="num hide-n">${a.power ? a.power.toFixed(1) : ""}</td><td>${action}</td></tr>`;
    }).join("") + `</tbody></table>` +
    (apps.length > 12 ? `<div class="more-row"><button class="linkbtn" id="appall">${appAll ? "Show fewer" : "Show all " + apps.length}</button></div>` : "");
  const t = S.apps.reduce((x, a) => x + a.mem, 0);
  $("apps-sub").textContent = `${S.apps.length} apps & processes`;
}
$("apps") && $("apps").addEventListener("click", e => { if (e.target.id === "appall"){ appAll = !appAll; renderApps(); } });
$("appsort") && ($("appsort").onclick = e => { const b = e.target.closest("button"); if (!b) return; appSort = b.dataset.v; $("appsort").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); renderApps(); });

function renderTabs(){
  const entries = Object.entries(S.tabs || {});
  if (!entries.length){ $("tabs").innerHTML = `<div class="note">No supported browser is open (Chrome, Brave, Edge, Arc, Vivaldi, Safari).</div>`; return; }
  $("tabs").innerHTML = entries.map(([b, info]) => {
    const g = S.apps.find(a => a.name === b);
    if (info.status === "denied") return `<div class="bhead"><b>${esc(b)}</b></div><div class="note">To list tabs, allow your terminal app to control ${esc(b)}: System Settings › Privacy &amp; Security › Automation.</div>`;
    if (info.status !== "ok") return `<div class="bhead"><b>${esc(b)}</b></div><div class="note">Couldn't read tabs${info.error ? ": " + esc(info.error) : ""}.</div>`;
    const tabs = info.tabs, dups = tabs.filter(t => t.dup), heavy = tabs.filter(t => t.heavy && !t.dup);
    const list = tabMode === "all" ? tabs : tabs.filter(t => t.dup || t.heavy);
    const pick = ts => ts.map(t => ({win:t.win, id:t.id, url:t.url}));
    return `<div class="bhead"><span><b>${esc(b)}</b> · ${info.count || tabs.length} tabs${g ? " · " + fmt(g.mem) : ""}</span>
      <span class="btns">${dups.length ? actBtn({label:`Close ${dups.length} duplicates`, kind:"close_tabs", browser:b, tabs:pick(dups)}) : ""}
      ${heavy.length > 1 ? actBtn({label:`Close ${heavy.length} heavy`, kind:"close_tabs", browser:b, tabs:pick(heavy), confirm:`Close ${heavy.length} tabs?`}) : ""}</span></div>` +
      (list.length ? list.slice(0, 150).map(t => `<div class="tab" title="${esc(t.url)}"><span class="fav">${esc((t.domain[0] || "·").toUpperCase())}</span>
        <div style="min-width:0"><div class="tt">${esc(t.title)}</div><div class="dm">${esc(t.domain || t.url)}</div></div>
        <span>${t.dup ? '<span class="tag dup">duplicate</span>' : ""}${t.heavy ? '<span class="tag heavy">heavy</span>' : ""}</span>

const CATS = [["media","Documents & media"],["other","Dev tools & other"],["code","Code projects"],["sdk","iOS & Android SDKs"],["ai","AI models"],["cache","Package caches"]];
let recs = [], recById = {}, view = "category", cur = null, curPath = null;
const selKeys = new Set(), seenKeys = new Set(), open = new Set();
const ikey = (r, it) => r.id + "|" + it.p;
const isSel = (r, i) => selKeys.has(ikey(r, r.items[i]));
const selIdx = r => r.items.map((_, i) => i).filter(i => isSel(r, i));
const selSize = r => selIdx(r).reduce((a, i) => a + r.items[i].s, 0);
const totalSel = () => recs.reduce((a, r) => a + selSize(r), 0);
const countSel = () => recs.filter(r => selIdx(r).length).length;
const tierSum = t => recs.filter(r => r.tier === t).reduce((a, r) => a + r.s, 0);
const tierCount = t => recs.filter(r => r.tier === t).length;
function setRec(r, on){ r.items.forEach(it => on ? selKeys.add(ikey(r, it)) : selKeys.delete(ikey(r, it))); }

function loadDisk(data){
  D = data;
  recs = D.recs; recById = Object.fromEntries(recs.map(r => [r.id, r]));
  recs.forEach(r => r.items.forEach(it => {
    const k = ikey(r, it);
    if (!seenKeys.has(k)){ seenKeys.add(k); if (r.tier === "safe") selKeys.add(k); }
  }));
  (function link(n, parent){ n._p = parent; (n.c || []).forEach(c => link(c, n)); })(D.tree, null);
  cur = D.tree;
  if (curPath){ // stay where the user was
    const find = (n) => { if (n.p === curPath) return n; for (const c of n.c || []) if (c.d && curPath.startsWith(c.p)) { const f = find(c); if (f) return f; } return null; };
    cur = find(D.tree) || D.tree;
  }
  $("host").textContent = D.host;
  buildDisk();
  if (LIVE){ renderBigFiles(); renderHealth(); }
}

function renderMeta(){

function squarify(items, x, y, w, h){
  const total = items.reduce((a, n) => a + n.s, 0), out = [];
  if (!total || w <= 0 || h <= 0) return out;
  const scale = w * h / total, nodes = items.map(n => ({n, a: n.s * scale}));
  const worst = (row, side) => { let s = 0, mx = 0, mn = Infinity; for (const r of row){ s += r.a; if (r.a > mx) mx = r.a; if (r.a < mn) mn = r.a; } const s2 = s*s, d2 = side*side; return Math.max(d2*mx/s2, s2/(d2*mn)); };
  const lay = row => {
    const s = row.reduce((a, r) => a + r.a, 0);
    if (w >= h){ const cw = s / h; let cy = y; for (const r of row){ const rh = r.a / cw; out.push({n:r.n, x, y:cy, w:cw, h:rh}); cy += rh; } x += cw; w -= cw; }
    else { const rh = s / w; let cx = x; for (const r of row){ const rw = r.a / rh; out.push({n:r.n, x:cx, y, w:rw, h:rh}); cx += rw; } y += rh; h -= rh; }
  };
  let row = [], i = 0;
  while (i < nodes.length){ const side = Math.min(w, h), it = nodes[i]; if (!row.length || worst(row.concat([it]), side) <= worst(row, side)){ row.push(it); i++; } else { lay(row); row = []; } }
  if (row.length) lay(row);
  return out;
}

  for (const r of squarify(kids, x, y, w, h)) drawTile(r.n, el, r, depth, inhRec);
}
function drawTile(n, parent, r, depth, inhRec){
  const g = 3, w = r.w - g, h = r.h - g;
  if (w < 2 || h < 2) return;

  t.className = "tile k-" + (n.k || "other") + (rec ? " cand " + rec.tier + (selIdx(rec).length ? " sel" : "") + (n.r ? "" : " inh") : "");
  t.style.cssText = `left:${r.x + g/2}px;top:${r.y + g/2}px;width:${w}px;height:${h}px`;
  if (rec) t.dataset.r = recId;
  t._n = n;
  const drill = n.d && n.c && n.c.length && !n.x;
  if (!drill) t.classList.add("flat");
  const nest = drill && depth < 2 && w > 90 && h > 70 && (depth === 0 || w * h > 70000);
  if (nest){
    t.innerHTML = `<div class="hd"><b>${esc(n.n)}</b><span class="mono">${fmt(n.s)}</span></div>`;
    parent.appendChild(t);
    drawKids(n, t, 4, 22, w - 10, h - 28, depth + 1, recId);
  } else {
    let html = "";

    if (w > 54 && h > 40){ const fs = Math.max(11, Math.min(18, Math.sqrt(w * h) / 9)); html += `<div class="sz mono" style="font-size:${fs}px">${fmt(n.s)}</div>`; }

}

function buildScript(){
  const chosen = recs.filter(r => selIdx(r).length), total = totalSel();
  const L = ["#!/usr/bin/env bash", `# diskmap cleanup script · ${D.host} · generated ${new Date().toLocaleString()}`,
    `# ${chosen.length} item(s), about ${fmt(total)}. Read it before running.`, "set -u", "",
    `read -r -p "Permanently delete ${chosen.length} item(s), about ${fmt(total)}? [y/N] " ok < /dev/tty`,
    '[[ "$ok" =~ ^[Yy]$ ]] || { echo "Aborted."; exit 1; }', `before=$(df -k "$HOME" | awk 'NR==2{print $4}')`, ""];
  for (const r of chosen){
    const s = selSize(r);
    L.push(`# ── ${r.title} (${fmt(s)}) ${"─".repeat(Math.max(2, 50 - r.title.length))}`);
    L.push(`echo "→ ${r.title.replace(/["$`\\]/g, "")} (${fmt(s)})"`);
    (r.pre || []).forEach(c => L.push(c));
    for (const i of selIdx(r)){ const it = r.items[i]; if (r.items.length > 1 && it.cmds.length) L.push(`# ${it.label.replace(/\n/g, " ")} · ${fmt(it.s)}`); it.cmds.forEach(c => L.push(c)); }
    (r.post || []).forEach(c => L.push(c));
    L.push("");
  }
  L.push(`after=$(df -k "$HOME" | awk 'NR==2{print $4}')`, `echo "Done. Freed about $(( (after - before) / 976563 )) GB."`);
  return L.join("\n") + "\n";
}

const prettyKey = k => k.replace(/^(sp\w+?_|spdisplays_|spnvme_|sppci_|spusb_|_)/, "").replace(/_/g, " ").replace(/^\w/, c => c.toUpperCase());
const SP_NAMES = {SPHardwareDataType:"Overview", SPSoftwareDataType:"Software", SPNVMeDataType:"SSD (NVMe)", SPStorageDataType:"Volumes", SPMemoryDataType:"Memory",
  SPDisplaysDataType:"Graphics & displays", SPPowerDataType:"Power", SPBluetoothDataType:"Bluetooth", SPAudioDataType:"Audio", SPCameraDataType:"Cameras",
  SPThunderboltDataType:"Thunderbolt / USB4", SPUSBDataType:"USB", SPUSBHostDataType:"USB", SPNetworkDataType:"Network services", SPPrintersDataType:"Printers",
  SPSecureElementDataType:"Secure Element", SPDiagnosticsDataType:"Diagnostics"};
function tree(x, depth){
  if (x == null) return "";
  if (Array.isArray(x)) return x.map(i => tree(i, depth)).join("");
  if (typeof x !== "object") return esc(String(x));
  const name = x._name;
  const scal = Object.entries(x).filter(([k, v]) => k !== "_name" && k !== "_items" && (typeof v !== "object" || v === null));
  const nest = Object.entries(x).filter(([k, v]) => k !== "_items" && v && typeof v === "object");
  let h = "";
  if (name && depth > 0) h += `<b>${esc(prettyKey(String(name)))}</b>`;
  h += scal.map(([k, v]) => `<div class="kv"><span>${esc(prettyKey(k))}</span><b>${esc(String(v).replace(/^sp\w+?_/, "").replace(/_/g, " "))}</b></div>`).join("");
  if (depth < 4) h += nest.map(([k, v]) => `<div class="nest"><b>${esc(prettyKey(k))}</b>${tree(v, depth + 1)}</div>`).join("");
  if (x._items && depth < 4) h += `<div class="nest">${x._items.map(i => tree(i, depth + 1)).join("")}</div>`;
  return h;
}

function lineChart(svg, T, series, f, opt){
  opt = opt || {};
  const W = svg.clientWidth || 500, Hh = opt.h || 150, pl = 44, pr = 8, pt = 6, pb = 18;
  const vals = series.flatMap(s => (s.v || []).filter(v => v != null));
  if (!vals.length || T.length < 2){ svg.outerHTML = `<div class="empty2" style="height:${Hh}px">No data yet</div>`; return; }
  let mn = opt.min != null ? opt.min : 0, mx = opt.max || Math.max(...vals, 1e-9) * 1.1;
  if (opt.tight){ mn = Math.min(...vals) * 0.97; mx = Math.max(...vals) * 1.02 + 1e-9; }
  if (mx - mn < 1e-9) mx = mn + 1;
  const x = i => pl + (T[i] - T[0]) / Math.max(1, T[T.length - 1] - T[0]) * (W - pl - pr);
  const y = v => pt + (1 - (v - mn) / (mx - mn)) * (Hh - pt - pb);
  const ticks = [mn, (mn + mx) / 2, mx];
  let g = `<g class="grid">${ticks.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/>`).join("")}</g>`;
  g += `<g class="ax">${ticks.map(v => `<text x="${pl - 6}" y="${y(v) + 3}" text-anchor="end">${esc(f(v))}</text>`).join("")}`;
  const span = T[T.length - 1] - T[0];
  for (let k = 0; k <= 3; k++){ const tt = T[0] + span * k / 3, d = new Date(tt * 1000);
    const lab = span > 2 * 86400 ? d.toLocaleDateString([], {month:"short", day:"numeric"}) : d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    g += `<text x="${pl + (W - pl - pr) * k / 3}" y="${Hh - 3}" text-anchor="${k === 0 ? "start" : k === 3 ? "end" : "middle"}">${esc(lab)}</text>`; }
  g += `</g>`;
  series.forEach((sr, si) => {
    const segs = []; let cur = null;
    (sr.v || []).forEach((val, i) => { if (val == null){ cur = null; return; } if (!cur){ cur = []; segs.push(cur); } cur.push([x(i), y(val)]); });
    const line = sg => "M" + sg.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
    if (si === 0 && series.length === 1) segs.forEach(sg => { g += `<path class="ar" fill="${sr.c}" d="${line(sg)} L${sg[sg.length - 1][0]} ${y(mn)} L${sg[0][0]} ${y(mn)} Z"/>`; });
    g += `<path class="ln" stroke="${sr.c}" d="${segs.map(line).join(" ")}"/>`;
  });
  g += `<line class="xh" y1="${pt}" y2="${Hh - pb}" x1="-10" x2="-10"/><g class="dots"></g><rect x="${pl}" y="0" width="${W - pl - pr}" height="${Hh}" fill="transparent"/>`;
  svg.setAttribute("viewBox", `0 0 ${W} ${Hh}`); svg.innerHTML = g;
  const xh = svg.querySelector(".xh"), dots = svg.querySelector(".dots");
  svg.onmousemove = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    const tx0 = T[0] + (px - pl) / (W - pl - pr) * span;
    let i = 0, best = Infinity; for (let j = 0; j < T.length; j++){ const dd = Math.abs(T[j] - tx0); if (dd < best){ best = dd; i = j; } }
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i));
    dots.innerHTML = series.map(sr => { const v = (sr.v || [])[i]; return v == null ? "" : `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${sr.c}" stroke="var(--panel)" stroke-width="2"/>`; }).join("");
    tip.innerHTML = `<b>${new Date(T[i] * 1000).toLocaleString([], {dateStyle:"medium", timeStyle:"short"})}</b>` + series.map(sr => { const v = (sr.v || [])[i], m = (sr.max || [])[i];
      return v == null ? "" : `<div>${esc(sr.n)}: <span class="mono">${f(v)}</span>${m != null && opt.bucket > 10 && Math.abs(m - v) > 1e-6 ? ` <span style="opacity:.6">peak ${f(m)}</span>` : ""}</div>`; }).join("") || "<div>No data (asleep or not running)</div>";
    tip.style.opacity = 1; const tw = tip.offsetWidth; let tx = e.clientX + 14; if (tx + tw > innerWidth - 8) tx = e.clientX - tw - 14;
    tip.style.left = tx + "px"; tip.style.top = (e.clientY + 14) + "px";
  };
  svg.onmouseleave = () => { hideTip(); xh.setAttribute("x1", -10); xh.setAttribute("x2", -10); dots.innerHTML = ""; };
}
function drawChart(svg, c){
  const H = HIST;
  const defs = c.extra ? [[c.k, "Total", "var(--c1)"]].concat(c.extra.map(([k, n], j) => [k, n, j === 0 ? "var(--c2)" : "var(--faint)"]))
             : c.two ? [[c.k, c.name, "var(--c1)"], [c.two[0], c.two[1], "var(--c2)"]] : [[c.k, c.t, "var(--c1)"]];
  lineChart(svg, H.series.t, defs.map(([k, n, col]) => ({n, c: col, v: H.series[k], max: H.series[k + "_max"]})), c.f,
    {max: c.max, tight: c.k === "disk_free" || c.k === "temp", bucket: H.bucket});
}

  $("cmdk-res").innerHTML = list.length ? list.map((c, i) => `<div class="it2 ${i === cmdSel ? "on" : ""}" data-i="${i}"><span class="${c.danger ? "" : ""}">${esc(c.t)}</span><span class="g">${esc(c.g)}</span></div>`).join("")
    : `<div class="note">No matches.</div>`;
  const el = $("cmdk-res").querySelector(".it2.on"); if (el) el.scrollIntoView({block:"nearest"});
}
let cmdArmed = null;
async function runCmd(c){
  if (!c) return;
  if (c.danger && cmdArmed !== c){ cmdArmed = c; toast("Press Enter again to confirm: " + esc(c.t), 3500); return; }
  cmdArmed = null; closeCmdk();
  if (c.run) return c.run();
  try { toast(esc(await post(c.a))); } catch(e){ toast("⚠︎ " + esc(e.message), 7000); }
}
if (LIVE){
  document.body.insertAdjacentHTML("beforeend", `<div class="cmdk" id="cmdk"><div class="box"><input id="cmdk-in" placeholder="Type a command: quit, clean, port, unload, go to…" autocomplete="off" spellcheck="false">
    <div class="res" id="cmdk-res"></div><div class="hint"><span><span class="kbd">↑↓</span> choose</span><span><span class="kbd">↵</span> run</span><span><span class="kbd">esc</span> close</span></div></div></div>
    <div class="modal appmodal" id="appmodal"><div class="card" id="appm"></div></div>`);
  $("cmdk-btn").onclick = openCmdk;
  $("cmdk").addEventListener("click", e => { if (e.target.id === "cmdk") closeCmdk(); const it = e.target.closest(".it2"); if (it) runCmd(cmdMatches()[+it.dataset.i]); });
  $("cmdk-in").addEventListener("input", () => { cmdSel = 0; cmdArmed = null; renderCmdk(); });
  $("cmdk-in").addEventListener("keydown", e => {
    if (e.key === "ArrowDown"){ cmdSel++; renderCmdk(); e.preventDefault(); }
    else if (e.key === "ArrowUp"){ cmdSel = Math.max(0, cmdSel - 1); renderCmdk(); e.preventDefault(); }
    else if (e.key === "Enter"){ runCmd(cmdMatches()[cmdSel]); e.preventDefault(); }
    else if (e.key === "Escape"){ closeCmdk(); }
  });
  document.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); $("cmdk").classList.contains("on") ? closeCmdk() : openCmdk(); }
    if (e.key === "Escape"){ $("appmodal").classList.remove("on"); APPM = null; }
  });
  $("appmodal").addEventListener("click", e => { if (e.target.id === "appmodal" || e.target.dataset.act === "close"){ $("appmodal").classList.remove("on"); APPM = null; } });
}

// ---------- Settings ----------
let SET = null;
async function loadSettings(){ try { SET = await (await fetch(api("/api/settings"))).json(); renderSettings(); } catch(e){} }
function renderSettings(){
  const s = SET; if (!s) return;
  const tg = (k, l, d) => `<div class="frow"><div><div>${l}</div><div class="fs">${d}</div></div><input type="checkbox" class="tgl" data-set="${k}" ${s[k] ? "checked" : ""} ${RO ? "disabled" : ""}></div>`;
  const nm = (k, l, d, unit) => `<div class="frow"><div><div>${l}</div><div class="fs">${d}</div></div><span><input type="number" data-set="${k}" value="${s[k]}" ${RO ? "disabled" : ""}> <span class="sub">${unit}</span></span></div>`;
  $("settings").innerHTML = `<div class="form"><div class="subh" style="padding-left:0">Notifications</div>
    ${tg("notify", "Notifications", "Alert me when something below happens, at most once every 30 minutes per alert.")}
    ${nm("notify_temp", "Hot CPU", "When the hottest CPU sensor stays above this.", "°C")}
    ${nm("notify_disk_gb", "Low disk space", "When free space drops below this.", "GB")}
    ${nm("notify_battery", "Low battery", "On battery at or below this.", "%")}
    ${tg("notify_pressure", "Critical memory pressure", "When macOS reports critical memory pressure.")}
    ${tg("notify_swap", "Heavy swapping", "When the Mac is writing lots of memory to disk.")}
    ${tg("notify_hog", "Runaway apps", "When a background app uses over 150% CPU for a few minutes (with a Quit button).")}
    ${tg("notify_crash", "Crashes", "When an app crashes, hangs, or the Mac panics.")}
    ${tg("notify_done", "Finished jobs", "When a cleanup, scan or maintenance task finishes.")}
    <div class="subh" style="padding-left:0;margin-top:10px">Autopilot (off unless you turn it on)</div>
    ${tg("auto_clean", "Weekly cleanup", "Clears everything in Safe to remove when plugged in and the Mac is quiet: first within a few minutes of turning this on, then weekly." + (s.last_auto_clean ? " Last run " + new Date(s.last_auto_clean * 1000).toLocaleDateString() + "." : ""))}
    ${tg("auto_models", "Unload AI models under memory pressure", "Unloads Ollama models after a minute of memory pressure. They reload on next use.")}
    ${tg("auto_tabs", "Close duplicate tabs under memory pressure", "Keeps the first copy of each page. Reads tabs in the background to do this.")}
    <div class="subh" style="padding-left:0;margin-top:10px">General</div>
    ${nm("idle_interval", "Sample every … when hidden", "How often to measure while no window is open. History still records.", "s")}
    ${tg("public_ip", "Show public IP", "Looks up your public address via api.ipify.org once a minute.")}
    ${nm("history_days", "Keep history for", "Older samples are deleted. Takes effect after restart.", "days")}
    <div class="frow"><div><div>Data folder</div><div class="fs">History database ${fmt(s.history_size || 0)} · settings.json</div></div><span class="mono sub">${esc(s.data_dir)}</span></div>
    <div class="frow"><div><div>Test</div><div class="fs">Make sure notifications reach you.</div></div>${actBtn({label:"Send test notification", kind:"notify_test"})}</div></div>`;
}
document.addEventListener("change", async e => {
  const el = e.target.closest("[data-set]"); if (!el || RO) return;
  const v = el.type === "checkbox" ? el.checked : Number(el.value);
  try { toast(esc(await post({kind:"settings", values:{[el.dataset.set]: v}}))); } catch(err){ toast("⚠︎ " + esc(err.message)); }
});

// ---------- delegated UI events for new views ----------
document.addEventListener("click", e => {
  const s1 = e.target.closest("[data-sort]");
  if (s1){ const k = s1.dataset.sort; pDir = pSort === k ? -pDir : (k === "name" || k === "user" ? 1 : -1); pSort = k; renderProcs(); return; }
  const s2 = e.target.closest("[data-asort]");
  if (s2){ appSortK = s2.dataset.asort; renderInfo(["apps"]); return; }
  const tr = e.target.closest("tr[data-pid]");
  if (tr && !e.target.closest(".act")){ const pid = +tr.dataset.pid; pOpen.has(pid) ? pOpen.delete(pid) : pOpen.add(pid); renderProcs(); }
});
const segWire = (id, fn) => { const el = $(id); if (el) el.onclick = e => { const b = e.target.closest("button"); if (!b) return; el.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); fn(b.dataset.v); }; };
if (LIVE){
  segWire("pscope", v => { pScope = v; renderProcs(); });
  segWire("appfilter", v => { appFilter = v; renderInfo(["apps"]); });
  segWire("hrange", v => { histRange = v; loadHistory(); });
  $("psearch").addEventListener("input", renderProcs);
  window.addEventListener("resize", () => { if (curView === "history" && HIST) renderHistory(); });
}

// ---------- theme (light / dark / system) ----------
const THEME_RULES = [];
for (const sh of document.styleSheets){ try { for (const r of sh.cssRules){ if (r.media && /prefers-color-scheme:\s*dark/.test(r.media.mediaText)) THEME_RULES.push([r, r.media.mediaText]); } } catch(e){} }
function applyTheme(t){
  THEME_RULES.forEach(([r, orig]) => { r.media.mediaText = t === "dark" ? "all" : t === "light" ? "not all" : orig; });
  document.documentElement.dataset.theme = t;
  document.querySelectorAll("#theme button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  try { localStorage.setItem("dm-theme", t); } catch(e){}
  try { window.webkit && window.webkit.messageHandlers.diskmap && window.webkit.messageHandlers.diskmap.postMessage({theme: t}); } catch(e){}
  window.dispatchEvent(new Event("dm-theme"));
}
let theme0 = "auto"; try { theme0 = localStorage.getItem("dm-theme") || "auto"; } catch(e){}
if (LIVE && LIVE.prefs && LIVE.prefs.ui_theme) theme0 = LIVE.prefs.ui_theme;
applyTheme(theme0);
const setTheme = t => { applyTheme(t); if (window.DM && window.DM.savePref) window.DM.savePref("ui_theme", t); };
if ($("theme")) $("theme").onclick = e => { const b = e.target.closest("button"); if (b) setTheme(b.dataset.t); };
window.__dmTheme = setTheme;

// shared helpers for the home page module
window.DM = {fmt, esc, actBtn, post, api, toast, icon, dur, ago, rate, spark, kv, hbar, na,
  get S(){ return S; }, get D(){ return D; }, info: n => idata(n), get INFO(){ return INFO; },
  tierSum: t => D ? tierSum(t) : 0, suggestions: () => S ? S.suggestions.concat(infoSuggestions()).filter(x => !(dismissed[x.id] > Date.now())) : [],
  go: v => { location.hash = "#/" + v; }, openApp: n => openApp(n), prefs: (LIVE && LIVE.prefs) || {},
  savePref: (k, v) => { if (!LIVE || RO) return; fetch("/api/action", {method:"POST", headers:{"Content-Type":"application/json","X-Token":LIVE.token}, body:JSON.stringify({kind:"settings", values:{[k]: v}})}).catch(() => {}); }, loadInfo: n => loadInfo(n), get view(){ return curView; }};

// ---------- boot ----------
let scanStatus = {};
if (D) loadDisk(D);
if (LIVE){
  if (!D) $("disk").innerHTML = `<div class="card empty" id="disk-wait"><span class="spin"></span>&nbsp; Mapping your disk for the first time. This takes a couple of minutes; everything above is already live.</div>`;
  let lastRev = -1;
  async function fetchDisk(){
    const r = await fetch(api("/api/disk")); const j = await r.json();
    if (j.pending) return;
    if (j.rev === lastRev) return;
    lastRev = j.rev; loadDisk(j);
  }
  let es = null;
  window.__dmPause = () => { if (es){ es.close(); es = null; } };
  window.__dmResume = () => { if (!es) connect(); };
  window.__dmGo = v => { location.hash = "#/" + v; };
  function connect(){
    es = new EventSource(api("/api/events"));
    es.addEventListener("live", e => { try { renderLive(JSON.parse(e.data)); } catch(err){ console.error(err); } });
    es.addEventListener("scan", e => {
      scanStatus = JSON.parse(e.data);
      if (scanStatus.has_data && lastRev !== scanStatus.rev) fetchDisk();
      if (!D && scanStatus.scanning && $("disk-wait")) $("disk-wait").innerHTML = `<span class="spin"></span>&nbsp; Mapping your disk · ${scanStatus.scanning.files.toLocaleString()} files · <span class="mono">${esc(String(scanStatus.scanning.path).slice(-60))}</span>`;
      if (D) renderMeta();
    });
    es.addEventListener("disk", () => fetchDisk());
    es.addEventListener("info", e => {
      const d = JSON.parse(e.data);
      INFO[d.section] = Object.assign(INFO[d.section] || {}, {busy: d.busy});
      if (!d.busy && ((VIEW_INFO[curView] || []).includes(d.section) || VIEW_INFO.overview.includes(d.section))) loadInfo([d.section]);
    });
    es.addEventListener("note", e => {
      const n = JSON.parse(e.data);
      if (!window.__dmApp) toast(`<b>${esc(n.title)}</b>${n.body ? " · " + esc(n.body) : ""}`, 7000);
    });
    es.addEventListener("task", e => {
      const t = JSON.parse(e.data), was = TASK && !TASK.done;
      TASK = t;
      if (curView === "developer"){ $("tasks").innerHTML = tasksHTML(); const o = $("taskout"); if (o) o.scrollTop = o.scrollHeight; }
      else if (!t.done) toast(`<span class="spin"></span>&nbsp; ${esc(t.title)}… <a href="#/developer" style="color:inherit">output</a>`, 4000);
      if (t.done && was) toast(`${esc(t.title)} ${t.rc === 0 ? "finished" : "failed (exit " + t.rc + ")"}.`, 6000);
    });
    es.addEventListener("clean", e => {
      const c = JSON.parse(e.data);
      cleaning = c.finished ? null : c;
      if (c.finished) toast(`Cleanup done. Freed <b>${fmt(c.freed)}</b>.${c.errors.length ? " " + c.errors.length + " step(s) had errors: " + esc(c.errors[0]) : ""}`, 9000);
      else toast(`<span class="spin"></span>&nbsp; Cleaning ${esc(c.title)} (${c.done + 1}/${c.total})…`, 60000);
      if (D) syncChecks();
    });
    es.onopen = () => { $("lp").classList.remove("off"); $("lp").lastChild.textContent = "Live"; };
    es.onerror = () => { $("lp").classList.add("off"); $("lp").lastChild.textContent = "Reconnecting"; };
  }
  connect();
  go();
  loadInfo(VIEW_INFO.overview);
  setInterval(() => { if (D) renderMeta(); }, 30000);
  setInterval(() => loadInfo(VIEW_INFO[curView] || []), 60000);
}
})();
</script>
