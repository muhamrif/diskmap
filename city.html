<style>
/* ================= City: a live skyline of your Mac ================= */
body.v-city{overflow:hidden}
body.v-city .wrap{max-width:none}
.cityview{position:fixed;left:14px;right:14px;bottom:14px;top:var(--cityTop,118px);border-radius:20px;overflow:hidden;background:#070b1f;isolation:isolate;
  box-shadow:0 20px 60px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.06) inset;color:#fff;user-select:none;-webkit-user-select:none}
.cityview{background:linear-gradient(180deg,#0e0b16,#07060c)}
.cityview svg.scape{position:absolute;left:0;right:0;top:0;bottom:var(--dockH,98px);width:100%;height:calc(100% - var(--dockH,98px));display:block;transition:opacity .35s}
.cityview.swap svg.scape,.cityview.swap .cv-labels{opacity:0}
.scape .lm{cursor:pointer}
.scape .lm,.scape .bgl{transition:opacity .3s}
.scape.spot .bgl{opacity:.38}
.scape.spot .lm:not(.hl){opacity:.32}
.scape .lm.hov{filter:url(#hovglow)}
.scape .twinkle{animation:cv-tw 3.2s ease-in-out infinite}
@keyframes cv-tw{0%,100%{opacity:.2}50%{opacity:1}}
.scape .blink{animation:cv-bl 1.6s steps(1) infinite}
@keyframes cv-bl{0%{opacity:1}50%{opacity:.08}}
.scape .sparkle{animation:cv-sp .9s steps(2) infinite}
@keyframes cv-sp{0%{opacity:1}50%{opacity:0}}
.scape .steam{animation:cv-steam 4s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes cv-steam{0%{opacity:0;transform:translateY(6px) scale(.6)}25%{opacity:.55}100%{opacity:0;transform:translateY(-60px) scale(1.9)}}
.scape .smoke{animation:cv-smoke 6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes cv-smoke{0%{opacity:0;transform:translate(0,4px) scale(.5)}20%{opacity:.6}100%{opacity:0;transform:translate(40px,-90px) scale(2.4)}}
.scape .flame{transform-box:fill-box;transform-origin:50% 100%;animation:cv-flk .18s ease-in-out infinite alternate}
@keyframes cv-flk{from{transform:scaleY(.92) skewX(-2deg)}to{transform:scaleY(1.06) skewX(2deg)}}
.scape .beam{transform-box:fill-box;transform-origin:50% 100%;animation:cv-sweep 7s ease-in-out infinite alternate}
@keyframes cv-sweep{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.scape .wave{animation:cv-wave 6s ease-in-out infinite alternate}
@keyframes cv-wave{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.scape .cloud{animation:cv-drift 140s linear infinite}
@keyframes cv-drift{from{transform:translateX(-400px)}to{transform:translateX(2000px)}}
.scape .bob{animation:cv-bob 5s ease-in-out infinite alternate;transform-box:fill-box}
@keyframes cv-bob{from{transform:translateY(-1.5px) rotate(-.6deg)}to{transform:translateY(1.5px) rotate(.6deg)}}
.scape .shoot{animation:cv-shoot 11s linear infinite;opacity:0}
@keyframes cv-shoot{0%,90%{opacity:0;transform:translate(0,0)}92%{opacity:1}100%{opacity:0;transform:translate(-280px,130px)}}
.scape .ring{pointer-events:none}
.scape .ring .r1{fill:none;stroke-width:2.5;transform-box:fill-box;transform-origin:50% 50%;animation:cv-ring 1.8s ease-out infinite}
@keyframes cv-ring{0%{transform:scale(.4);opacity:.95}100%{transform:scale(2.6);opacity:0}}
.scape .jet{transition:transform .8s}

/* overlay text */
.cv-top{position:absolute;left:0;right:0;top:0;padding:22px 26px 60px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;pointer-events:none;
  background:linear-gradient(180deg,rgba(4,6,20,.42),rgba(4,6,20,0));z-index:3}
.cityview.day .cv-top{background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0))}
.cv-hello{max-width:600px;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.cv-hello .t{font:600 12px/1 -apple-system,system-ui;letter-spacing:.14em;text-transform:uppercase;opacity:.78;display:flex;gap:8px;align-items:center}
.cv-hello h2{font:700 38px/1.05 -apple-system,"SF Pro Display",system-ui;margin:10px 0 8px;letter-spacing:-.025em}
.cv-hello p{margin:0;font-size:14.5px;opacity:.9;display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:auto}
.cv-hello p a{color:inherit;font-weight:650;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.5);cursor:pointer}
.cityview.day .cv-hello{color:#0b1530;text-shadow:0 1px 14px rgba(255,255,255,.6)}
.cityview.day .cv-hello p a{border-color:rgba(11,21,48,.4)}
.cv-ctrl{display:flex;gap:8px;align-items:center;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.cv-glass{background:rgba(12,16,40,.5);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(255,255,255,.14);color:#fff}
.cv-btn{font:600 13px/1 -apple-system,system-ui;border-radius:12px;padding:9px 12px;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap}
.cv-btn:hover{background:rgba(12,16,40,.72)}
.cv-btn .fl{font-size:17px;line-height:1}
.cv-btn small{font-weight:500;opacity:.65;font-size:11.5px}
.cv-btn svg{width:12px;height:12px;opacity:.7}
.cv-seg{display:flex;border-radius:12px;padding:3px;gap:2px}
.cv-seg button{border:0;background:transparent;color:rgba(255,255,255,.72);font:600 12px/1 -apple-system,system-ui;padding:7px 9px;border-radius:9px;cursor:pointer;white-space:nowrap}
.cv-seg button:hover{color:#fff;background:rgba(255,255,255,.08)}
.cv-seg button.on{background:rgba(255,255,255,.18);color:#fff}

/* city picker */
.cv-pop{position:absolute;top:70px;right:22px;width:min(560px,calc(100% - 44px));border-radius:18px;padding:14px;z-index:6;display:none;
  box-shadow:0 30px 80px rgba(0,0,0,.45)}
.cv-pop.on{display:block;animation:cv-in .18s ease-out}
@keyframes cv-in{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.cv-pop h4{margin:2px 4px 10px;font:600 11px/1 -apple-system,system-ui;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
.cv-cities{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.cv-cc{position:relative;border-radius:14px;padding:12px 12px 10px;cursor:pointer;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);text-align:left;color:#fff;font:inherit;overflow:hidden;min-height:96px}
.cv-cc:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25)}
.cv-cc.on{border-color:#ffd27a;background:rgba(255,210,122,.12)}
.cv-cc .fl{font-size:22px}
.cv-cc b{display:block;font-size:14px;margin-top:6px}
.cv-cc span{display:block;font-size:11px;opacity:.65;margin-top:2px}
.cv-cc i{position:absolute;right:10px;top:12px;font-style:normal;font:600 11px/1 ui-monospace,Menlo,monospace;opacity:.7}
.cv-cc svg{position:absolute;right:0;bottom:0;width:70%;height:46px;opacity:.22}
.cv-pop .cv-foot{margin:12px 4px 2px;font-size:11.5px;opacity:.6;line-height:1.45}

/* labels */
.cv-labels{position:absolute;left:0;right:0;top:0;bottom:var(--dockH,98px);pointer-events:none;z-index:2;transition:opacity .35s;overflow:hidden}
.cv-lb{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0}
.cv-lb .c{display:flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px 5px 7px;font:650 12.5px/1 -apple-system,system-ui;white-space:nowrap;
  background:rgba(8,12,34,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);color:#fff;transition:transform .15s,background .15s}
.cv-lb .c svg{width:14px;height:14px;opacity:.85}
.cv-lb .c em{font-style:normal;font-weight:500;opacity:.65;font-size:11.5px}
.cv-lb .st{width:1px;height:12px;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0))}
.cv-lb:hover .c,.cv-lb.hl .c{background:rgba(8,12,34,.85);transform:translateY(-2px)}
.cv-lb.warn .c{border-color:#ffb84d;box-shadow:0 0 0 3px rgba(255,184,77,.18)}
.cv-lb.bad .c{border-color:#ff5a4a;box-shadow:0 0 0 3px rgba(255,90,74,.22)}
.cv-lb .dt{width:7px;height:7px;border-radius:50%;flex:none}
.cityview.lbl-off .cv-labels{opacity:0}
.cityview.lbl-off .cv-lb{pointer-events:none}
.cityview:not(.lbl-names) .cv-lb em{display:none}

/* tooltip */
.cv-tip{position:absolute;z-index:7;pointer-events:none;min-width:200px;max-width:280px;border-radius:14px;padding:11px 13px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;
  box-shadow:0 14px 40px rgba(0,0,0,.4)}
.cv-tip.on{opacity:1;transform:none}
.cv-tip .k{font:600 10.5px/1 -apple-system,system-ui;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
.cv-tip .n{font:700 22px/1.1 ui-monospace,"SF Mono",Menlo,monospace;margin:6px 0 2px;letter-spacing:-.02em}
.cv-tip .n small{font:500 12px/1 -apple-system,system-ui;opacity:.7;margin-left:6px;letter-spacing:0}
.cv-tip .m{font-size:12px;opacity:.82;line-height:1.4;margin-top:6px}
.cv-tip .h{font-size:11px;opacity:.55;margin-top:8px}

/* inspector */
.cv-insp{position:absolute;top:14px;right:14px;bottom:110px;width:370px;max-width:calc(100% - 28px);border-radius:20px;z-index:5;display:flex;flex-direction:column;
  transform:translateX(calc(100% + 30px));transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden}
.cv-insp.on{transform:none}
.cv-insp .ih{display:flex;gap:12px;align-items:center;padding:16px 16px 12px}
.cv-insp .ih .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.cv-insp .ih .ic svg{width:20px;height:20px}
.cv-insp .ih .k{font:600 10.5px/1 -apple-system,system-ui;letter-spacing:.1em;text-transform:uppercase;opacity:.6}
.cv-insp .ih h3{margin:4px 0 0;font-size:15.5px;font-weight:650;color:#fff}
.cv-insp .ih .x{margin-left:auto;color:rgba(255,255,255,.7);font-size:20px;width:30px;height:30px;border-radius:9px}
.cv-insp .ih .x:hover{background:rgba(255,255,255,.1);color:#fff}
.cv-insp .ib{overflow:auto;padding:0 16px 16px;flex:1;min-height:0}
.cv-insp .iv{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cv-insp .iv b{font:700 40px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:-.03em}
.cv-insp .iv span{font-size:13px;opacity:.7}
.cv-insp .im{font-size:12.5px;line-height:1.5;opacity:.78;margin:10px 0 4px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06)}
.cv-insp .im b{opacity:1;color:#ffd27a;font-weight:600}
.cv-insp svg.isp{display:block;width:100%;height:70px;margin:12px 0 2px}
.cv-insp .isp .a{opacity:.18}
.cv-insp .isp .l{fill:none;stroke-width:2;vector-effect:non-scaling-stroke}
.cv-insp .ispl{display:flex;justify-content:space-between;font-size:10.5px;opacity:.5;font-family:ui-monospace,Menlo,monospace}
.cv-insp h4{margin:16px 0 6px;font:600 10.5px/1 -apple-system,system-ui;letter-spacing:.1em;text-transform:uppercase;opacity:.55}
.cv-insp .kv2{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:12.5px}
.cv-insp .kv2:last-child{border-bottom:0}
.cv-insp .kv2 span{opacity:.62}
.cv-insp .kv2 b{font-weight:600;text-align:right;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px}
.cv-insp .ar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:12.5px}
.cv-insp .ar:last-child{border-bottom:0}
.cv-insp .ar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
.cv-insp .ar .nm small{display:block;font-weight:400;opacity:.55;font-size:11px}
.cv-insp .ar .v{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;opacity:.85}
.cv-insp .bar2{height:4px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:5px;overflow:hidden}
.cv-insp .bar2 i{display:block;height:100%;border-radius:2px}
.cv-insp .sgx{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);margin-bottom:8px;font-size:12.5px}
.cv-insp .sgx .t{font-weight:600;display:flex;gap:8px;align-items:center}
.cv-insp .sgx .s{opacity:.7;font-size:12px;margin:3px 0 8px;line-height:1.4}
.cv-insp .if{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 16px;border-top:1px solid rgba(255,255,255,.08)}
.cityview .btn{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.16)}
.cityview .btn:hover{background:rgba(255,255,255,.16)}
.cityview .btn.dark{background:#fff;color:#0b1020;border-color:#fff}
.cityview .btn.armed{background:#e5483b;border-color:#e5483b;color:#fff}
.cv-insp .ok{padding:14px;border-radius:12px;background:rgba(76,194,133,.14);color:#9ff0c4;font-size:12.5px}

/* dock */
.cv-dock{position:absolute;left:14px;right:14px;bottom:14px;display:flex;gap:8px;z-index:4;overflow-x:auto;scrollbar-width:none;padding:2px}
.cv-dock::-webkit-scrollbar{display:none}
.cv-tile{flex:1 0 128px;min-width:128px;border-radius:15px;padding:10px 12px 8px;cursor:pointer;text-align:left;font:inherit;position:relative;overflow:hidden;transition:transform .15s,background .15s,border-color .15s}
.cv-tile:hover,.cv-tile.hl{transform:translateY(-3px);background:rgba(12,16,40,.72);border-color:rgba(255,255,255,.3)}
.cv-tile.sel{border-color:#ffd27a}
.cv-tile .tl{display:flex;align-items:center;gap:6px;font:600 11px/1 -apple-system,system-ui;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-tile .tl svg{width:13px;height:13px;flex:none}
.cv-tile .tv{font:700 19px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:-.02em;margin-top:7px;white-space:nowrap}
.cv-tile .tv small{font:500 11px/1 -apple-system,system-ui;opacity:.6;margin-left:3px;letter-spacing:0}
.cv-tile .ts{font-size:10.5px;opacity:.55;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-tile svg.tsp{position:absolute;left:0;right:0;bottom:0;width:100%;height:30px;opacity:.5;pointer-events:none}
.cv-tile .lvl{position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%}
.lv-ok{background:#5fd39a}.lv-warn{background:#ffb84d;box-shadow:0 0 0 3px rgba(255,184,77,.25)}.lv-bad{background:#ff5a4a;box-shadow:0 0 0 3px rgba(255,90,74,.3);animation:pulse 1.4s infinite}.lv-na{background:rgba(255,255,255,.3)}
.cv-hint{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);font-size:11.5px;opacity:.0;z-index:3;pointer-events:none;transition:opacity .4s;white-space:nowrap;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.cv-hint.on{opacity:.75}
@media (max-width: 760px){
  .cityview{left:8px;right:8px;bottom:8px;border-radius:16px}
  .cv-top{flex-direction:column;padding:14px 14px 40px}
  .cv-hello h2{font-size:24px}
  .cv-hello p{font-size:12.5px}
  .cv-ctrl{justify-content:flex-start}
  .cv-insp{top:auto;left:8px;right:8px;bottom:96px;width:auto;max-height:62%;transform:translateY(calc(100% + 120px))}
  .cv-insp.on{transform:none}
  .cv-tile{flex:0 0 118px;min-width:118px}
  .cv-pop{top:auto;bottom:100px;right:8px;left:8px;width:auto}
  .cv-hello p{display:none}
  .cv-hello h2{margin:6px 0 0}
  .cv-seg button{padding:6px 7px;font-size:11px}
  .cv-seg button[data-sky="city"]{display:none}
  #cv-lbl span{display:none}
  .cv-btn{padding:8px 10px}
}
</style>
<script>
(function(){

const DM = window.DM, $ = id => document.getElementById(id);
const {fmt, esc, actBtn, post, toast} = DM;
const root = $("city-root");
if (!root) return;
const NS = "http://www.w3.org/2000/svg";
const W = 1600, H = 900, HZ = 720, ST = 790, TUN = 828;

/* ------------------------------------------------------------------ utils */
function rng(seed){ let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); if (attrs) for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

function modeForHour(h){ return h >= 7.5 && h < 17.5 ? "day" : h >= 5.5 && h < 7.5 ? "dawn" : h >= 17.5 && h < 19.5 ? "dusk" : "night"; }
function hourIn(tz){
  try { const p = new Intl.DateTimeFormat("en-GB", {timeZone: tz, hour: "2-digit", minute: "2-digit", hourCycle: "h23"}).formatToParts(new Date());
        return +p.find(x => x.type === "hour").value + +p.find(x => x.type === "minute").value / 60; } catch(e){ const d = new Date(); return d.getHours() + d.getMinutes() / 60; }
}
function timeIn(tz){ try { return new Date().toLocaleTimeString([], {timeZone: tz, hour: "numeric", minute: "2-digit"}); } catch(e){ return ""; } }

const PAL = {
  night: {sky:["#040716","#0a1233","#1d1a48","#45285a"], glow:"#ff8a5c", glowA:.35, far:"#141936", mid:"#0e1330", near:"#0a0e25", lm:"#161c40", edge:"#2e3870", win:["#ffd27a","#ffe7b0","#bfe3ff"], water:["#0b1230","#050918"], refl:.6, winOn:.55, street:"#0b0e20", land:"#0c1024", stone:"#5a4e46", stoneD:"#3d3530", cable:"#9aa3c4", haze:.0},

  dawn:  {sky:["#25305e","#6e6aa6","#e7a1a0","#ffd7a1"], glow:"#ffd7a1", glowA:.3, far:"#5a5f8a", mid:"#454a75", near:"#353a62", lm:"#474c7a", edge:"#8287b8", win:["#ffe7b0","#fff3d6","#d6ecff"], water:["#5a6596","#2c3462"], refl:.35, winOn:.18, street:"#2a2f55", land:"#2b2f52", stone:"#9a8574", stoneD:"#6f5f53", cable:"#c5c8e6", haze:.12},
  day:   {sky:["#3f82d4","#74abeb","#b4d5f6","#e2effb"], glow:"#ffffff", glowA:0, far:"#a4b5cf", mid:"#8095b3", near:"#5f7192", lm:"#6c7fa1", edge:"#b3c3db", win:["#dcecff","#eef6ff","#c9def5"], water:["#5d8bc0","#3a6496"], refl:.22, winOn:.04, street:"#4a5674", land:"#5a6682", stone:"#b7a58e", stoneD:"#8f7f6b", cable:"#4b4f60", haze:.3},
};
const mix = (a, b, t) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join(""); };

/* ------------------------------------------------------------------ icons */
const IC = {
  cpu:'<rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/>',
  mem:'<rect x="3" y="7" width="18" height="10" rx="1.5"/><path d="M7 17v3M11 17v3M15 17v3M7 10v4M11 10v4M15 10v4"/>',

  k.skyline = (g, style, color, minH, maxH, winOn, seed, opt = {}) => {
    const r = rng(seed), base = opt.base || HZ, x1 = opt.x1 != null ? opt.x1 : W + 80;

    const win = (wx, wy, ww, wh) => { (r() < .5 ? wd : wd2)[(r() * 3) | 0].push(`M${f1(wx)} ${f1(wy)}h${ww}v${wh}h-${ww}z`); };

        else if (t < .45) d += `M${f1(x)} ${f1(top + 1)}V${f1(top - w * .5)}L${f1(x + w)} ${f1(top + 1)}z`;
        else if (t < .6){ d += `M${f1(x + w * .2)} ${f1(top + 1)}V${f1(top - 22)}h${f1(w * .6)}V${f1(top + 1)}z`; d += `M${f1(x + w / 2 - .8)} ${f1(top - 22)}v-${f1(30 + r() * 30)}h1.6v${f1(30 + r() * 30)}z`; }
        for (let wy = top + 6; wy < base - 6; wy += 9) for (let wx = x + 3; wx < x + w - 3; wx += 5) if (r() < winOn * .8) win(wx, wy, 1.6, 5.5);
      } else if (style === "paris"){
        w = 46 + r() * 70; h = minH + r() * (maxH - minH);
        const top = base - h; box(x, top, w);
        d += `M${f1(x)} ${f1(top + .5)}L${f1(x + 5)} ${f1(top - 13)}H${f1(x + w - 5)}L${f1(x + w)} ${f1(top + .5)}z`;
        for (let c = x + 9; c < x + w - 9; c += 16 + r() * 14) d += `M${f1(c)} ${f1(top - 12)}v-${f1(5 + r() * 5)}h4v${f1(5 + r() * 5)}z`;
        if (r() < .05){ const cx = x + w / 2; d += `M${f1(cx - 12)} ${f1(top - 12)}a12 14 0 0 1 24 0z M${f1(cx - 1)} ${f1(top - 26)}v-8h2v8z`; }
        if (r() < .04){ const cx = x + w * .3; d += `M${f1(cx - 5)} ${f1(top - 12)}L${f1(cx)} ${f1(top - 70)}L${f1(cx + 5)} ${f1(top - 12)}z`; }
        for (let wy = top + 7; wy < base - 6; wy += 10) for (let wx = x + 5; wx < x + w - 5; wx += 8) if (r() < winOn) win(wx, wy, 3, 5);

        else if (t < .26){ w = 30 + r() * 20; h = minH + r() * 30; const top = base - h; box(x, top, w); const cx = x + w / 2; d += `M${f1(cx - 8)} ${f1(top + .5)}V${f1(top - 30)}h16V${f1(top + .5)}z M${f1(cx - 8)} ${f1(top - 30)}L${f1(cx)} ${f1(top - 90)}L${f1(cx + 8)} ${f1(top - 30)}z`; }
        else { w = 40 + r() * 60; h = minH + r() * (maxH - minH) * .55; const top = base - h; box(x, top, w); if (r() < .5) d += `M${f1(x)} ${f1(top + .5)}L${f1(x + w / 2)} ${f1(top - 16)}L${f1(x + w)} ${f1(top + .5)}z`; grid(x, top, w, 8, 10, 3, 4.5); }
      } else if (style === "tokyo"){
        w = 20 + r() * 42; h = minH + Math.pow(r(), 1.1) * (maxH - minH);

function renderInspector(){

  const X = V._, v = V[key], st = STATS[key], a = sc.anchors[key] || {}, S = X.S;
  let body = "", foot = "";
  const lead = `<div class="iv"><b>${esc(v.txt)}</b><span>${esc(v.sub || "")}</span></div><div class="im">${CITY.flag} <b>${esc(a.name || "")}</b> · ${esc(sc.maps[key] || "")}</div>`;
  if (key === "cpu"){
    const top = S.apps.slice().sort((p, q) => q.cpu - p.cpu).slice(0, 6).map(x => Object.assign({}, x, {_v: x.cpu.toFixed(0) + "%"}));
    body = bigSpark(v.hist, 100, st.col) + `<h4>Details</h4>` + kv("Load average", S.cpu.load.map(x => x.toFixed(2)).join(" · ")) + kv("Cores", S.cpu.cores) + (S.cpu.user != null ? kv("User / system", `${Math.round(S.cpu.user)}% / ${Math.round(S.cpu.sys)}%`) : "") + kv("Processes · threads", `${S.procs} · ${S.threads || "–"}`) +
      (X.hw.power && X.hw.power.cpu != null ? kv("CPU power", X.hw.power.cpu.toFixed(1) + " W") : "") +
      `<h4>Using the CPU</h4>` + appRows(top, x => x.cpu, Math.max(100, top[0] ? top[0].cpu : 1), st.col) + sugFor(["cpu", "hog"], ["hog"]);
  } else if (key === "mem"){
    const m = X.m, top = S.apps.slice().sort((p, q) => q.mem - p.mem).slice(0, 6).map(x => Object.assign({}, x, {_v: fmt(x.mem)}));
    const seg = (n, c, l) => n > 0 ? `<i style="width:${(n / m.total * 100).toFixed(1)}%;background:${c}" title="${l}"></i>` : "";
    body = bigSpark(v.hist, 100, st.col) + `<div class="membar" style="background:rgba(255,255,255,.1)">${seg(m.app, "#9d93ff", "Apps")}${seg(m.wired, "#e7a24a", "Wired")}${seg(m.compressed, "#f3a3c1", "Compressed")}${seg(m.cached, "#4b6a8a", "Cached")}</div>` +
      `<h4>Details</h4>` + kv("Pressure", m.pressure) + kv("Apps", fmt(m.app || 0)) + kv("Wired", fmt(m.wired || 0)) + kv("Compressed", fmt(m.compressed || 0)) + kv("Swap used", fmt(m.swap || 0)) +
      (S.models && S.models.length ? kv("AI models loaded", S.models.map(x => x.name).join(", ")) : "") +
      `<h4>Using the most memory</h4>` + appRows(top, x => x.mem, top[0] ? top[0].mem : 1, st.col) + sugFor(["mem", "ollama", "tabs", "growth"], ["mem", "ollama", "tabs", "grow"]);
    if (S.models && S.models.length) foot += S.models.map(md => actBtn({label: `Unload ${md.name}`, kind: "unload_model", model: md.name})).join("");
  } else if (key === "gpu"){
    const pw = X.hw.power || {};
    body = bigSpark(v.hist, 100, st.col) + `<h4>Details</h4>` + (S.gpu ? kv("Utilisation", S.gpu.util + "%") + (S.gpu.mem ? kv("GPU memory in use", fmt(S.gpu.mem)) : "") : kv("GPU", "not available")) + (pw.gpu != null ? kv("GPU power", pw.gpu.toFixed(1) + " W") : "") + (pw.ane != null ? kv("Neural Engine", pw.ane.toFixed(1) + " W") : "") +
      (S.models && S.models.length ? `<h4>Local AI models</h4>` + S.models.map(md => kv(md.name, fmt(md.vram || md.size))).join("") : "");
    if (S.models && S.models.length) foot += S.models.map(md => actBtn({label: `Unload ${md.name}`, kind: "unload_model", model: md.name})).join("");
  } else if (key === "temp" || key === "fans"){
    const T = X.T, sens = (T.sensors || []).slice().sort((p, q) => q.c - p.c).slice(0, 6), fans = X.hw.fans || [];
    const top = S.apps.slice().sort((p, q) => (q.power || 0) - (p.power || 0)).slice(0, 4).map(x => Object.assign({}, x, {_v: (x.power || 0).toFixed(1)}));
    body = (key === "temp" ? bigSpark(T.hist, 110, st.col) : "") + `<h4>Details</h4>` + kv("Thermal state", X.hw.thermal || "–") + (T.cpu_avg != null ? kv("CPU average", Math.round(T.cpu_avg) + " °C") : "") + (T.gpu != null ? kv("GPU", Math.round(T.gpu) + " °C") : "") + (T.ssd != null ? kv("SSD", Math.round(T.ssd) + " °C") : "") +
      fans.map(f => kv(`Fan ${f.id + 1}`, `${Math.round(f.rpm)} rpm${f.max ? " · " + Math.round(f.rpm / f.max * 100) + "%" : ""}`)).join("") + (X.hw.sys_power != null ? kv("Whole system", X.hw.sys_power.toFixed(1) + " W") : "") +
      (sens.length ? `<h4>Hottest sensors</h4>` + sens.map(s => kv(s.name, s.c.toFixed(1) + " °C")).join("") : "") +
      `<h4>Most energy (impact)</h4>` + appRows(top, x => x.power || 0, Math.max(1, top[0] ? top[0].power || 1 : 1), st.col) + sugFor(["heat", "fan", "cpu"], ["heat", "fan"]);
  } else if (key === "disk"){
    const safe = DM.tierSum("safe"), rev = DM.tierSum("review");
    body = `<div class="membar" style="background:rgba(255,255,255,.12);height:8px"><i style="width:${((1 - X.freePct) * 100).toFixed(1)}%;background:${X.freePct < .05 ? "#ff5a4a" : X.freePct < .12 ? "#ffb84d" : "#9fe3ff"}"></i></div>` +
      `<h4>Details</h4>` + kv("Used", fmt(X.d.used || X.d.total - X.d.free)) + kv("Free", `${fmt(X.d.free)} (${(X.freePct * 100).toFixed(1)}%)`) + kv("Safe to clean", fmt(safe)) + kv("Worth a look", fmt(rev)) +
      ((X.hs.volumes || []).length > 1 ? `<h4>Other volumes</h4>` + X.hs.volumes.slice(1).map(x => kv(x.name, `${fmt(x.free)} free`)).join("") : "") + sugFor(["disk"], ["disk", "clean"]);
    if (safe > 5e8 && DM.D) foot += actBtn({label: `Clean ${fmt(safe)} of caches`, kind: "__cleansafe", confirm: `Clean ${fmt(safe)}?`}, "dark");
    foot += actBtn({label: "Rescan", kind: "rescan"});
  } else if (key === "net"){
    const nt = (X.hs.nettop || []).slice(0, 6), wifi = X.hs.wifi || {};
    body = bigSpark(v.hist, v.max, st.col) + `<h4>Details</h4>` + kv("Download", DM.rate(tgt.down)) + kv("Upload", DM.rate(tgt.up)) + (X.hs.ping_internet != null ? kv("Internet ping", Math.round(X.hs.ping_internet) + " ms") : "") + (X.hs.ping_gateway != null ? kv("Router ping", Math.round(X.hs.ping_gateway) + " ms") : "") +
      (wifi.ssid || wifi.signal ? kv("Wi-Fi", `${wifi.ssid || ""}${wifi.signal ? " · " + wifi.signal + " dBm" : ""}`) : "") +
      (nt.length ? `<h4>Apps using the network</h4>` + nt.map(x => `<div class="ar"><div class="nm">${esc(x.app || x.name)}</div><span class="v">↓${DM.rate(x.down)}</span><span class="v">↑${DM.rate(x.up)}</span></div>`).join("") : "") + sugFor(["net", "wifi", "lan"], ["net", "wifi", "ping"]);
  } else if (key === "io"){
    const IO = X.IO;
    body = bigSpark(IO.hist_r, v.max, st.col) + `<h4>Details</h4>` + kv("Reading", DM.rate(IO.read || 0)) + kv("Writing", DM.rate(IO.write || 0)) + (IO.riops != null ? kv("Operations", `${IO.riops} read · ${IO.wiops} write /s`) : "") +
      (IO.total_read ? kv("Read since boot", fmt(IO.total_read)) : "") + (IO.total_write ? kv("Written since boot", fmt(IO.total_write)) : "") + `<div class="im" style="margin-top:12px">The ${esc(a.name || "train")} heading right carries reads, the one heading left carries writes. They speed up with throughput and stop when the disk is idle.</div>`;
  } else if (key === "bat"){
    const b = X.b;
    body = b.percent == null ? `<div class="ok">This Mac runs on mains power.</div>` : `<h4>Details</h4>` + kv("Charge", b.percent + "%" + (b.charging ? " · charging" : "")) + kv("Health", b.health != null ? b.health + "%" : "–") + kv("Cycles", b.cycles ?? "–") + (b.temp != null ? kv("Temperature", b.temp + " °C") : "") +
      (b.watts != null ? kv(b.charging ? "Charging at" : "Draw", Math.abs(b.watts).toFixed(1) + " W") : "") + (b.adapter_name ? kv("Adapter", b.adapter_name) : "") + (b.time_min ? kv("Time left", DM.dur(b.time_min * 60)) : "") + sugFor(["battery"], ["bat"]);
  } else if (key === "apps"){
    const top = X.userApps.slice().sort((p, q) => q.mem - p.mem).slice(0, 10).map(x => Object.assign({}, x, {_v: fmt(x.mem)}));
    body = `<h4>Open apps</h4>` + appRows(top, x => x.mem, top[0] ? top[0].mem : 1, st.col);
  } else if (key === "alerts"){
    const list = X.sug.slice(0, 8);
    body = list.length ? list.map(x => `<div class="sgx"><div class="t"><span class="dot sev-${x.sev}"></span>${esc(x.title)}</div><div class="s">${esc(x.sub)}</div><div class="btns">${(x.actions || []).slice(0, 2).map(a => actBtn(a, x.sev === "high" ? "dark" : "")).join("")}</div></div>`).join("") : `<div class="ok">Nothing needs your attention right now.</div>`;
  }
  insp.innerHTML = `<div class="ih"><span class="ic" style="background:${st.col}22;color:${st.col}">${icon(key)}</span><div><div class="k">${esc(st.label)}</div><h3>${esc(a.name || st.label)}</h3></div><button class="x" data-close title="Close (Esc)">×</button></div>
    <div class="ib">${lead}${body}</div>
    <div class="if">${foot}<button class="btn sm" data-gotab="${st.tab}">Open ${esc(st.tabName)} ›</button></div>`;
}
insp.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) return closeInspector();
  const g = e.target.closest("[data-gotab]"); if (g) DM.go(g.dataset.gotab);
});

function renderDock(){
  dock.innerHTML = DOCK.map(k => `<button class="cv-tile cv-glass" data-k="${k}"><span class="lvl lv-na"></span><div class="tl" style="color:${STATS[k].col}">${icon(k)}<span style="color:#fff">${esc(STATS[k].label)}</span></div><div class="tv">–</div><div class="ts">${esc((sc.anchors[k] || {}).name || "")}</div><svg class="tsp" viewBox="0 0 100 30" preserveAspectRatio="none"></svg></button>`).join("");
}
function miniSpark(vals, max, col){
  if (!vals || vals.length < 2) return "";
  const n = Math.min(60, vals.length), vv = vals.slice(-n), mx = max || Math.max(...vv) * 1.1 || 1;
  const d = "M" + vv.map((v, i) => f1(i / (n - 1) * 100) + " " + f1(29 - clamp(v / mx, 0, 1) * 24)).join(" L");
  return `<path d="${d} L100 30 L0 30 Z" fill="${col}" opacity=".18"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.4" vector-effect="non-scaling-stroke"/>`;
}
function updateDock(){
  dock.querySelectorAll(".cv-tile").forEach(t => {
    const k = t.dataset.k, v = V[k]; if (!v) return;
    t.querySelector(".tv").innerHTML = k === "net" ? `${esc(DM.rate(tgt.down))}<small>↓</small>` : k === "io" ? `${esc(v.txt)}` : `${esc(v.txt)}${k === "temp" && v.v != null ? "<small>C</small>" : ""}`;
    t.querySelector(".lvl").className = "lvl lv-" + v.lvl;
    t.querySelector(".ts").textContent = (k === "alerts" ? v.sub : (sc.anchors[k] || {}).name || v.sub);
    if (v.hist) t.querySelector(".tsp").innerHTML = miniSpark(v.hist, v.max, STATS[k].col);
  });
}
dock.addEventListener("mouseover", e => { const t = e.target.closest(".cv-tile"); if (t) spot(t.dataset.k); });
dock.addEventListener("mouseleave", () => unspot());
dock.addEventListener("click", e => { const t = e.target.closest(".cv-tile"); if (!t) return; inspKey === t.dataset.k ? closeInspector() : openInspector(t.dataset.k); });

/* ---------- animation ---------- */
let lastT = 0, labelTick = 0;
function frame(t){
  requestAnimationFrame(frame);
  if (!sc || DM.view !== "city" || document.hidden) { lastT = t; return; }
  const dt = Math.min(.05, (t - lastT) / 1000 || 0); lastT = t;
  const kk = 1 - Math.pow(.02, dt);
  shown.cpu = lerp(shown.cpu, tgt.cpu, kk); shown.mem = lerp(shown.mem, tgt.mem, kk); shown.gpu = lerp(shown.gpu, tgt.gpu, kk); shown.fan = lerp(shown.fan, tgt.fan, kk);
  // inspector pan
  if (Math.abs(pan.t - pan.x) > .5){ pan.x = lerp(pan.x, pan.t, 1 - Math.pow(.004, dt)); if (Math.abs(pan.t - pan.x) <= .5) pan.x = pan.t; fitView(); placeLabels(); }
  // parallax
  par.x = lerp(par.x, par.tx, 1 - Math.pow(.05, dt)); par.y = lerp(par.y, par.ty, 1 - Math.pow(.05, dt));
  if (Math.abs(par.x - (sc._px || 0)) > .001 || Math.abs(par.y - (sc._py || 0)) > .001){
    sc._px = par.x; sc._py = par.y;
    sc.layers.forEach(g => { const d = +g.dataset.px; g.setAttribute("transform", `translate(${f1(-par.x * d * 28)} ${f1(-par.y * d * 8)})`); });
    if (++labelTick % 3 === 0) placeLabels();
  }
  // memory glass
  if (sc.mem){ const hh = (sc.mem.bottom - sc.mem.top) * clamp(shown.mem, .02, 1); sc.mem.rect.setAttribute("y", f1(sc.mem.bottom - hh)); sc.mem.rect.setAttribute("height", f1(hh)); }
  // CPU floors
  const rows = sc.cpu.rows, on = Math.round(rows.length * clamp(shown.cpu / 100, 0, 1));
  for (let i = 0; i < rows.length; i++){ const want = i < on ? .95 : .07; if (rows[i]._o !== want){ rows[i]._o = want; rows[i].setAttribute("opacity", want); } }
  const cc = loadCol(shown.cpu);
  if (sc._cc !== cc){ sc._cc = cc; sc.cpu.crown.forEach(p => p.setAttribute("fill", cc)); if (sc.cpu.glow) sc.cpu.glow.setAttribute("fill", cc); }
  if (sc.cpu.glow) sc.cpu.glow.setAttribute("opacity", (.14 + Math.min(.35, shown.cpu / 230)).toFixed(2));
  // GPU
  const gq = Math.round(shown.gpu);
  if (sc._gq !== gq){ sc._gq = gq; sc.gpu.els.forEach(o => o.e.setAttribute("opacity", (o.min + (o.max - o.min) * clamp(shown.gpu / 70, 0, 1)).toFixed(2))); }
  // fountain jets
  if (sc.fans.jets.length){ const s = clamp(.15 + shown.fan * 1.1 + (V.temp && V.temp.v > 75 ? .2 : 0), .1, 1).toFixed(2); if (sc._js !== s){ sc._js = s; sc.fans.jets.forEach(j => j.style.transform = `scaleY(${s})`); } }
  // spins
  sc.spins.forEach(s => { s.a = (s.a + s.rate() * dt) % 360; s.e.setAttribute("transform", `rotate(${s.a.toFixed(2)} ${s.cx} ${s.cy})`); });
  // traffic (network)
  const N = sc.net;
  if (N){
    const want = r => Math.min(16, Math.round(Math.log10(1 + r / 2e3) * 3.6));
    const cnt = dir => N.cars.reduce((a, c) => a + (c.dir === dir), 0);
    if (cnt(1) < want(tgt.down) && Math.random() < .08) N.cars.push(mkLight(N, 1));
    if (cnt(-1) < want(tgt.up) && Math.random() < .08) N.cars.push(mkLight(N, -1));
    for (let i = N.cars.length - 1; i >= 0; i--){
      const c = N.cars[i], sp = (60 + Math.log10(1 + (c.dir > 0 ? tgt.down : tgt.up) / 1e3) * 40) * N.scale;
      c.x += c.dir * sp * dt;
      c.e.setAttribute("transform", `translate(${f1(c.x)} ${c.dir > 0 ? N.yR : N.yL})`);
      if (c.x > N.x1 + 20 || c.x < N.x0 - 20){ c.e.remove(); N.cars.splice(i, 1); }
    }
  }
  // vehicles (apps)
  const A = sc.apps;
  if (A){
    const want = Math.min(10, Math.max(2, Math.round(tgt.apps / 3)));
    if (A.list.length < want && Math.random() < .03){
      const dir = Math.random() < .55 ? 1 : -1, g = el("g", {}, A.g); A.make(g, dir);
      A.list.push({e: g, dir, x: dir > 0 ? A.x0 - 40 : A.x1 + 40, y: dir > 0 ? A.yR : A.yL, v: .8 + Math.random() * .4});
    }
    for (let i = A.list.length - 1; i >= 0; i--){
      const x = A.list[i]; x.x += x.dir * (36 + shown.cpu * 1.1) * x.v * dt;
      x.e.setAttribute("transform", `translate(${f1(x.x)} ${x.y})${x.dir < 0 ? " scale(-1 1)" : ""}`);
      if (x.x > A.x1 + 60 || x.x < A.x0 - 60){ x.e.remove(); A.list.splice(i, 1); }
    }
  }
  // trains (disk I/O)
  if (sc.io){
    const sp = r => r < 1e5 ? 0 : 120 + Math.log10(r / 1e5) * 180, io = sc.io;
    const vr = sp(tgt.read), vw = sp(tgt.write);
    // a train keeps going until it leaves the tunnel, then waits off-screen while the disk is idle
    if (vr > 0 || io.xr > -400) io.xr += Math.max(vr, 90) * dt;
    if (io.xr > W + 40) io.xr = -420;
    if (vw > 0 || io.xw < W + 80) io.xw -= Math.max(vw, 90) * dt;
    if (io.xw < -320) io.xw = W + 100;
    io.tR.setAttribute("transform", `translate(${f1(io.xr)} 0)`); io.tW.setAttribute("transform", `translate(${f1(io.xw)} 0)`);
  }
  // ticker strip
  const T = sc.alerts;
  if (T && T.tw){ T.tx -= 70 * dt; if (T.tx < T.x - T.tw) T.tx = T.x + T.w; T.strip.setAttribute("x", f1(T.tx)); }
}
function mkLight(N, dir){
  const g = el("g", {}, N.g);
  if (dir > 0){ el("circle", {cx: 0, cy: 0, r: 2.2, fill: "#fffbe6"}, g); el("circle", {cx: 4, cy: 0, r: 1.4, fill: "#fffbe6", opacity: .8}, g); el("ellipse", {cx: 11, cy: 0, rx: 11, ry: 2.5, fill: "#fffbe6", opacity: .25}, g); }
  else { el("circle", {cx: 0, cy: 0, r: 2, fill: "#ff3b30"}, g); el("circle", {cx: 4, cy: 0, r: 1.4, fill: "#ff3b30", opacity: .85}, g); }
  return {e: g, dir, x: dir > 0 ? N.x0 - 10 : N.x1 + 10};
}

/* ---------- layout + lifecycle ---------- */
// fit the viewBox so the important part of the city (x 100–1500, y 50–900) is always visible
const pan = {x: 0, t: 0};
let view = {x: 0, w: W, px: 1};
function fitView(){
  const r = svg.getBoundingClientRect(); if (!r.width || !r.height) return;
  const A = r.width / r.height, core = 1400 / 850;
  let vw, vh;
  if (A >= core){ vh = 850; vw = vh * A; if (vw > 1700){ vw = 1700; vh = vw / A; } }
  else { vw = 1400; vh = vw / A; if (vh > 940){ vh = 940; vw = vh * A; } }
  const px = r.width / vw, room = pan.t > 0 || pan.x > 1 ? 386 / px : 0;   // the inspector covers the right edge, so we may slide past it
  const x = clamp(800 - vw / 2 + pan.x, -60, Math.max(-60, W + 60 - vw) + room);
  view = {x, w: vw, px};
  svg.setAttribute("viewBox", `${f1(x)} ${f1(900 - vh)} ${f1(vw)} ${f1(vh)}`);
}
// slide the city so the landmark being inspected isn't hidden under the inspector
function panFor(key){
  if (!key || innerWidth < 760){ pan.t = 0; return; }
  const a = sc && sc.anchors[key]; if (!a) return;
  const cw = cv.clientWidth, free = cw - 400;
  const base = clamp(800 - view.w / 2, -60, Math.max(-60, W + 60 - view.w));
  const sx = (a.x - base) * view.px;   // where it would be on screen without panning
  pan.t = sx > free - 60 ? (sx - free * .55) / view.px : 0;
}
function layout(){
  const on = DM.view === "city";
  document.body.classList.toggle("v-city", on);
  if (!on) return;
  const nav = document.getElementById("nav");
  if (nav) document.documentElement.style.setProperty("--cityTop", Math.round(nav.getBoundingClientRect().bottom + 10) + "px");
  const dh = dock.offsetHeight; if (dh) cv.style.setProperty("--dockH", (dh + 22) + "px");
  requestAnimationFrame(() => { fitView(); placeLabels(); });
}
let builtMode = null;
function ensure(){
  if (!sc){ buildScene(); builtMode = sc.mode; }
  else if (currentMode() !== builtMode){ buildScene(); builtMode = sc.mode; }
}
(window.DM_hooks = window.DM_hooks || []).push(s => { if (DM.view === "city"){ ensure(); applyData(); if (++hookN % 5 === 1) layout(); } else computeValues(); });
let hookN = 0;
window.addEventListener("hashchange", () => { layout(); if (DM.view === "city"){ window.scrollTo(0, 0); ensure(); if (DM.S) applyData(); } else { pop.classList.remove("on"); tip.classList.remove("on"); } });
window.addEventListener("resize", () => { layout(); placeLabels(); });
window.DM_cmds = () => CITIES.map(c => ({g: "City", t: `Show ${c.name} ${c.flag}`, run: () => { DM.go("city"); setTimeout(() => switchCity(c.id), 50); }}))
  .concat([{g: "City", t: "Next city", run: () => cycleCity(1)}, {g: "City", t: "Toggle city labels", run: () => $("cv-lbl").click()}]);
window.DM_city = {switchCity, cycleCity, openInspector, closeInspector, get city(){ return CITY.id; }, cities: () => CITIES.map(c => c.id), get scene(){ return sc; },
  compute: computeValues, get values(){ return V; }, stats: STATS, icon: k => icon(k),
  info: () => ({id: CITY.id, name: CITY.name, flag: CITY.flag, blurb: CITY.blurb, sil: CITY.sil, day: ["day", "dawn"].includes(currentMode())}),
  get names(){ const o = {}; if (sc) for (const k in sc.anchors) o[k] = sc.anchors[k].name; return o; }};
buildScene(); builtMode = sc.mode;
layout();
requestAnimationFrame(frame);
setInterval(() => { if (DM.view === "city"){ ensure(); updateHello(); } }, 60000);
let hinted = false; try { hinted = !!localStorage.getItem("dm-city-hint"); } catch(e){}
if (!hinted){ setTimeout(() => $("cv-hint").classList.add("on"), 1500); setTimeout(() => $("cv-hint").classList.remove("on"), 9000); try { localStorage.setItem("dm-city-hint", "1"); } catch(e){} }
})();
